name: Deploy Supabase Edge Functions

# Despliega las Edge Functions al hacer push a main cuando cambian.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: etbxynbhqzbhzogxytnn
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Despliega todas las functions de supabase/functions. verify_jwt se toma
      # de supabase/config.toml. Los secrets (Resend, etc.) se gestionan aparte.
      - run: supabase functions deploy --project-ref "$PROJECT_REF"
