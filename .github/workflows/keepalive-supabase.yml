name: Keep-alive Supabase

# Evita que el proyecto free de Supabase se pause por inactividad.
# Ping ligero a PostgREST cada 3 días (y bajo demanda).
on:
  schedule:
    # Cada 3 días a las 07:00 UTC
    - cron: '0 7 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST (boards)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Faltan secrets SUPABASE_URL y/o SUPABASE_ANON_KEY en el repo."
            exit 1
          fi

          url="${SUPABASE_URL%/}/rest/v1/boards?select=id&limit=1"
          code=$(curl -sS -o /tmp/keepalive.out -w "%{http_code}" \
            "$url" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json")

          echo "HTTP ${code}"
          # 2xx/3xx/4xx = el proyecto respondió (RLS puede dar 401/ vacío).
          # Solo fallamos ante 5xx o sin respuesta.
          case "$code" in
            [234]*)
              exit 0
              ;;
            *)
              echo "Respuesta inesperada:"
              head -c 500 /tmp/keepalive.out || true
              echo
              exit 1
              ;;
          esac
