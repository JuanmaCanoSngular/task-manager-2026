# request-access la invoca el cliente con su JWT -> verificación activada.
[functions.request-access]
verify_jwt = true

# approve-access la abre el owner desde el email sin sesión -> sin JWT.
# La seguridad la da el token de un solo uso.
[functions.approve-access]
verify_jwt = false

# agent-create-task: captura con Gemini; requiere sesión del usuario.
[functions.agent-create-task]
verify_jwt = true

# telegram-link: genera códigos de emparejamiento; requiere sesión.
[functions.telegram-link]
verify_jwt = true

# delete-account: el usuario borra su propia cuenta (JWT).
[functions.delete-account]
verify_jwt = true

# search-images: Unsplash; API key en secret; anon key basta para invocar.
[functions.search-images]
verify_jwt = true
